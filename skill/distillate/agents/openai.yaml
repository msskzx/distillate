interface:
  display_name: "Distillate Challenge"
  short_description: "Save a solved challenge for later review"
  default_prompt: "Use $distillate to capture the noteworthy challenge we just solved."
dependencies:
  tools:
    - type: "mcp"
      value: "distillate"
      description: "Creates cards in the local Distillate review queue"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
